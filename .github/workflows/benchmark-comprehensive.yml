# Comprehensive Benchmark Workflow
# Runs full benchmarks including stress tests and updates results

name: Comprehensive Benchmark

on:
  # Run on schedule (every Monday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main (optional, can be removed if too frequent)
  push:
    branches:
      - main
    paths:
      - 'implementations/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark-comprehensive.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  run-benchmark:
    name: Run Comprehensive Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Install Chromium for Lighthouse
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          CHROME_BIN=$(which chromium-browser 2>/dev/null || which chromium 2>/dev/null)
          echo "CHROME_PATH=${CHROME_BIN}" >> $GITHUB_ENV
          echo "Chromium installed at: ${CHROME_BIN}"
      
      - name: Install benchmark dependencies
        working-directory: benchmarks/scripts
        run: npm install
      
      - name: Run comprehensive Docker benchmark
        working-directory: benchmarks/scripts
        run: npm run benchmark:docker:full
        continue-on-error: true
      
      - name: Run stress tests
        working-directory: benchmarks/scripts
        run: npm run benchmark:stress
        continue-on-error: true
      
      - name: Merge stress test results into comprehensive results
        working-directory: benchmarks/scripts
        run: npm run merge-stress-results
        continue-on-error: true
      
      - name: Capture test environment metadata
        working-directory: benchmarks/scripts
        run: node capture-environment.js

      - name: Update README.md with benchmark results
        working-directory: benchmarks/scripts
        run: npm run update-readme
      
      - name: Check if benchmark results exist
        id: check_results
        run: |
          if [ -f "benchmarks/results/comprehensive-benchmark-results.json" ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload benchmark results as artifact
        if: steps.check_results.outputs.results_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            README.md
          retention-days: 90
      
      - name: Open PR to commit benchmark results to README.md
        if: steps.check_results.outputs.results_exist == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a new branch for the benchmark results
          BRANCH_NAME="benchmark-results-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          
          # Stage ONLY README.md — the raw results JSON (benchmarks/results/*.json)
          # are gitignored and must not be committed. They are uploaded as a
          # 90-day workflow artifact instead. No other files change.
          git add README.md
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to README.md - nothing to commit."
            exit 0
          fi
          
          # Commit and push
          git commit -m "Update benchmark results - $(date +%Y-%m-%d)"
          git push origin "$BRANCH_NAME"
          
          # Create pull request using GitHub CLI.
          # The body is built from a QUOTED heredoc delimiter so nothing inside
          # is expanded by the shell. Markdown backticks (which otherwise run as
          # command substitution, silently blanking text) and any future $VAR
          # are therefore safe. Our two dynamic values are injected afterwards
          # via literal placeholders.
          LH_STATUS="Lighthouse performance metrics"
          if grep -q "failed to produce Lighthouse results" README.md; then
            LH_STATUS="Lighthouse performance metrics — **unavailable this run** (last valid table preserved and labelled)"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PR_BODY=$(cat <<'EOF' | sed 's/^ *//'
          This PR contains updated benchmark results from the automated comprehensive benchmark run.

          ## Summary
          - Full benchmark including all frameworks (React, Vue, Angular, Leptos, Yew, Dioxus, Blade)
          - Stress tests included
          - Bundle size analysis
          - @LH_STATUS@
          - CPU and memory usage statistics (idle and under-load, labelled)

          ## Test environment
          See the "Test Environment" section in `README.md` for runner specs, browser/Docker versions, and the load-test tool.

          > **Note:** This PR updates `README.md` only. The raw benchmark results stay in `benchmarks/results/`, are gitignored, and are available as a 90-day workflow artifact: @RUN_URL@

          Please review the results and merge if everything looks correct.
          EOF
          )
          PR_BODY="${PR_BODY//@RUN_URL@/$RUN_URL}"
          PR_BODY="${PR_BODY//@LH_STATUS@/$LH_STATUS}"

          gh pr create \
            --title "Update Benchmark Results - $(date +%Y-%m-%d)" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "benchmark-results" \
            --label "automated"

          # A branch pushed with GITHUB_TOKEN does not trigger pull_request
          # workflows, so the PR head would have no check runs and the
          # auto-merge job (which requires green checks on the head SHA) would
          # never merge it. workflow_dispatch is the one event GITHUB_TOKEN may
          # still trigger, so run the pull-request CI workflows explicitly
          # against the results branch; their check runs attach to the head SHA
          # and gate the merge.
          echo "Triggering CI for $BRANCH_NAME"
          gh workflow run basic-checks.yml --ref "$BRANCH_NAME"
          gh workflow run benchmark.yml --ref "$BRANCH_NAME"

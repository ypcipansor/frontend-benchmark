# Runs the full visual-parity gate on every PR: capture -> verify -> parity ->
# pixel, plus the deterministic optimize/montage and the regression tests.
#
# All seven implementations are built and started explicitly, including the
# three Rust/WASM ones (trunk build) and Blade.php (PHP built-in server). Nothing
# is skipped silently: if a toolchain or a server cannot start, the job fails.
name: Visual Parity

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Capture / verify / parity / pixel
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      # Rust toolchain + wasm target + trunk, used by the Leptos/Yew/Dioxus dists.
      - name: Install Rust (wasm32) and trunk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install PHP and Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-xml php-mbstring
          php --version
          composer --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            implementations/leptos
            implementations/yew
            implementations/dioxus

      - name: Check Node.js version for the docs tooling
        working-directory: docs
        run: npm run check:node

      - name: Install docs tooling (npm ci)
        working-directory: docs
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python tooling (pinned)
        run: python3 -m pip install -r docs/requirements.txt

      - name: Install implementation Node dependencies
        # The implementation lockfiles are intentionally not committed, so these
        # installs are unlocked (unlike docs/, which uses npm ci).
        run: |
          npm install --prefix implementations/react --no-audit --no-fund
          npm install --prefix implementations/vue --no-audit --no-fund
          npm install --prefix implementations/angular --no-audit --no-fund

      - name: Install Blade dependencies
        # composer.lock is also gitignored, so install rather than `composer install --no-update`.
        run: composer install --working-dir=implementations/blade --no-interaction --no-progress

      - name: Build Rust/WASM dists
        run: |
          set -e
          for fw in leptos yew dioxus; do
            echo "::group::trunk build $fw"
            (cd "implementations/$fw" && trunk build --release)
            # The dists reference ../../shared/styles/todo.css; mirror it inside
            # each dist so it resolves when served directly.
            mkdir -p "implementations/$fw/dist/shared/styles"
            cp shared/styles/todo.css "implementations/$fw/dist/shared/styles/"
            echo "::endgroup::"
          done

      - name: Start all seven servers
        run: bash docs/scripts/start-servers.sh --ready-timeout 180

      - name: Capture screenshots (35)
        working-directory: docs
        run: npm run capture

      - name: Verify screenshots are complete and non-blank
        working-directory: docs
        run: npm run verify

      - name: Structural + interaction parity (live)
        working-directory: docs
        run: npm run parity

      - name: Pixel parity vs the React reference
        working-directory: docs
        run: npm run pixel

      - name: Optimize images (35 JPEGs)
        working-directory: docs
        run: npm run optimize

      - name: Build comparison montages (5 PNGs)
        working-directory: docs
        run: npm run montage

      - name: Regression tests
        working-directory: docs
        run: npm test

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots
            docs/images
          retention-days: 14

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: docs/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop servers
        if: always()
        run: bash docs/scripts/stop-servers.sh
